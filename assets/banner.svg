<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-label="manuel@quilty0 neofetch terminal">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .titlebar { fill: #161b22; }
      .mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #8b949e; font-size: 12px; }
      .prompt-user { fill: #7ee787; font-size: 13px; font-weight: 600; }
      .prompt-path { fill: #79c0ff; font-size: 13px; font-weight: 600; }
      .cmd { fill: #e6edf3; font-size: 13px; }
      .ascii { fill: #79c0ff; font-size: 12px; white-space: pre; }
      .header { fill: #7ee787; font-size: 13px; font-weight: 700; }
      .sep { fill: #30363d; font-size: 13px; }
      .key { fill: #79c0ff; font-size: 12.5px; font-weight: 600; }
      .val { fill: #c9d1d9; font-size: 12.5px; }
      .typing {
        animation: typeIn 3.2s steps(42, end) forwards;
      }
      .cursor {
        fill: #7ee787;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes typeIn {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }
    </style>
    <clipPath id="termClip">
      <rect x="1" y="1" width="838" height="338" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Window Frame -->
  <rect class="bg" x="1" y="1" width="838" height="338" rx="10" ry="10"/>
  <g clip-path="url(#termClip)">
    <rect class="titlebar" x="1" y="1" width="838" height="32"/>
    <line x1="1" y1="33" x2="839" y2="33" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- macOS Traffic Lights -->
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text class="mono title" x="420" y="21" text-anchor="middle">manuel@quilty0: ~ (neofetch)</text>

  <!-- Command 1 -->
  <text class="mono" x="28" y="62">
    <tspan class="prompt-user">manuel@quilty0</tspan>
    <tspan class="prompt-path"> ~</tspan>
    <tspan class="cmd"> $ neofetch --ascii-cube</tspan>
  </text>

  <!-- Left ASCII Cube -->
  <g class="mono ascii" transform="translate(36, 92)">
    <text y="0">        .----------------.</text>
    <text y="15">       /                /|</text>
    <text y="30">      /                / |</text>
    <text y="45">     /                /  |</text>
    <text y="60">    *----------------*   |</text>
    <text y="75">    |   quilty0      |   |</text>
    <text y="90">    |   :: dev       |   |</text>
    <text y="105">    |   :: data      |   /</text>
    <text y="120">    |                |  /</text>
    <text y="135">    |                | /</text>
    <text y="150">    *----------------*</text>
  </g>

  <!-- Right System Info -->
  <g class="mono" transform="translate(290, 92)">
    <text class="header" y="0">manuel@quilty0</text>
    <text class="sep" y="16">------------------------------</text>
    <text y="34"><tspan class="key">Role: </tspan><tspan class="val">Software Developer &amp; Data Enthusiast</tspan></text>
    <text y="53"><tspan class="key">Location: </tspan><tspan class="val">Brazil</tspan></text>
    <text y="72"><tspan class="key">Languages: </tspan><tspan class="val">TypeScript, Python, JavaScript</tspan></text>
    <text y="91"><tspan class="key">Frontend: </tspan><tspan class="val">React, HTML5, CSS3</tspan></text>
    <text y="110"><tspan class="key">Data: </tspan><tspan class="val">Streamlit, Pandas, Data Analysis</tspan></text>
    <text y="129"><tspan class="key">Focus: </tspan><tspan class="val">Web Apps, Wearables, Automation</tspan></text>
    <text y="148"><tspan class="key">Status: </tspan><tspan class="val">learning in public, building tools</tspan></text>

    <!-- Color Palette Row 1 -->
    <g transform="translate(0, 168)">
      <rect x="0"   y="0" width="24" height="12" fill="#21262d"/>
      <rect x="24"  y="0" width="24" height="12" fill="#f85149"/>
      <rect x="48"  y="0" width="24" height="12" fill="#3fb950"/>
      <rect x="72"  y="0" width="24" height="12" fill="#d29922"/>
      <rect x="96"  y="0" width="24" height="12" fill="#58a6ff"/>
      <rect x="120" y="0" width="24" height="12" fill="#bc8cff"/>
      <rect x="144" y="0" width="24" height="12" fill="#39c5cf"/>
      <rect x="168" y="0" width="24" height="12" fill="#b1bac4"/>
      <!-- Color Palette Row 2 -->
      <rect x="0"   y="12" width="24" height="12" fill="#6e7681"/>
      <rect x="24"  y="12" width="24" height="12" fill="#ff7b72"/>
      <rect x="48"  y="12" width="24" height="12" fill="#7ee787"/>
      <rect x="72"  y="12" width="24" height="12" fill="#e3b341"/>
      <rect x="96"  y="12" width="24" height="12" fill="#79c0ff"/>
      <rect x="120" y="12" width="24" height="12" fill="#d2a8ff"/>
      <rect x="144" y="12" width="24" height="12" fill="#56d4dd"/>
      <rect x="168" y="12" width="24" height="12" fill="#f0f6fc"/>
    </g>
  </g>

  <!-- Command 2 (Animated) -->
  <text class="mono" x="28" y="314">
    <tspan class="prompt-user">manuel@quilty0</tspan>
    <tspan class="prompt-path"> ~</tspan>
    <tspan class="cmd"> $ </tspan>
    <tspan class="cmd typing">echo "TypeScript, Python &amp; Building Tools"</tspan>
  </text>
  <rect class="cursor" x="502" y="302" width="8" height="14"/>
</svg>
